# Codemagic: Yükle Detayla derlemeleri
# - android-apk : telefona kurulacak test APK'sı
# - android-aab : Google Play'e yüklenecek imzalı paket (AAB)
# - ios-testflight : iPhone sürümünü derler, imzalar, App Store Connect'e yükler
# - asc-hazirla / asc-gonder : App Store sayfasını doldurur / incelemeye gönderir
# iOS için gizli değer yalnızca bir tane: "asc" grubundaki ASC_KEY_P8 (diğer uygulamalarla aynı anahtar).
workflows:
  android-apk:
    name: Yükle Detayla APK
    max_build_duration: 30
    instance_type: mac_mini_m2
    environment:
      java: 17
    scripts:
      - name: Gradle izinleri
        script: chmod +x ./gradlew
      - name: APK derle
        script: ./gradlew assembleDebug
    artifacts:
      - app/build/outputs/apk/**/*.apk

  android-aab:
    name: Google Play paketi (AAB)
    max_build_duration: 30
    instance_type: mac_mini_m2
    environment:
      java: 17
    scripts:
      - name: Gradle izinleri
        script: chmod +x ./gradlew
      - name: AAB derle
        script: ./gradlew bundleRelease
    artifacts:
      - app/build/outputs/bundle/**/*.aab

  ios-testflight:
    name: iOS TestFlight
    instance_type: mac_mini_m2
    max_build_duration: 60
    environment:
      groups:
        - asc
      vars:
        ASC_KEY_ID: 9PJ9V3965R
        ASC_ISSUER_ID: 195bfec6-edd0-4a8e-8cd8-6a1d5d51bb6e
        APPLE_TEAM_ID: GS55JS3WKJ
        P12_PASS: yukle-ci-gecici
      xcode: latest
    scripts:
      - name: Web uygulamasını kopyala, Xcode projesini üret
        script: |
          set -e
          rm -rf ios/public && cp -R app/src/main/assets ios/public
          brew install xcodegen
          cd ios && xcodegen generate
      - name: Sertifika, profil, paket kimliği
        script: |
          set -e
          export RUNNER_TEMP=$HOME/imza GITHUB_ENV=$HOME/imza/env
          mkdir -p $RUNNER_TEMP
          pip3 install --quiet pyjwt cryptography || pip3 install --quiet --break-system-packages pyjwt cryptography
          python3 tool/ios_signing.py
          keychain initialize
          keychain add-certificates --certificate $RUNNER_TEMP/dagitim.p12 --certificate-password "$P12_PASS"
          UUID=$(grep '^PROFILE_UUID=' $GITHUB_ENV | cut -d= -f2-)
          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          cp $RUNNER_TEMP/profil.mobileprovision "$HOME/Library/MobileDevice/Provisioning Profiles/$UUID.mobileprovision"
          xcode-project use-profiles --project ios/YukleDetayla.xcodeproj
      - name: Derleme numarası
        script: |
          N=$((1 + ${BUILD_NUMBER:-0}))
          echo "Derleme numarası: $N"
          sed -i '' "s/^CURRENT_PROJECT_VERSION = .*/CURRENT_PROJECT_VERSION = $N/" ios/Config.xcconfig
      - name: iPhone paketi (IPA)
        script: |
          xcode-project build-ipa --project ios/YukleDetayla.xcodeproj --scheme YukleDetayla --config Release \
            --export-options-plist=$HOME/export_options.plist
    artifacts:
      - build/ios/ipa/*.ipa
    publishing:
      app_store_connect:
        api_key: $ASC_KEY_P8
        key_id: 9PJ9V3965R
        issuer_id: 195bfec6-edd0-4a8e-8cd8-6a1d5d51bb6e
        submit_to_testflight: false

  asc-hazirla:
    name: "App Store: sayfayı hazırla"
    instance_type: mac_mini_m2
    max_build_duration: 45
    environment:
      groups:
        - asc
      vars:
        ASC_KEY_ID: 9PJ9V3965R
        ASC_ISSUER_ID: 195bfec6-edd0-4a8e-8cd8-6a1d5d51bb6e
    scripts:
      - name: Mağaza sayfası, ekran görüntüleri, derleme
        script: |
          pip3 install --quiet pyjwt cryptography || pip3 install --quiet --break-system-packages pyjwt cryptography
          python3 tool/asc_islem.py

  asc-gonder:
    name: "App Store: incelemeye gönder"
    instance_type: mac_mini_m2
    max_build_duration: 45
    environment:
      groups:
        - asc
      vars:
        ASC_KEY_ID: 9PJ9V3965R
        ASC_ISSUER_ID: 195bfec6-edd0-4a8e-8cd8-6a1d5d51bb6e
        GONDER: evet
    scripts:
      - name: Hazırla ve incelemeye gönder
        script: |
          pip3 install --quiet pyjwt cryptography || pip3 install --quiet --break-system-packages pyjwt cryptography
          python3 tool/asc_islem.py
