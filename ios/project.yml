# XcodeGen proje tanımı: `xcodegen generate` → YukleDetayla.xcodeproj
# Web uygulaması (../app/src/main/assets) Codemagic'te ios/public klasörüne kopyalanır.
name: YukleDetayla
options:
  deploymentTarget:
    iOS: "15.0"
  developmentLanguage: tr
configFiles:
  Debug: Config.xcconfig
  Release: Config.xcconfig
packages:
  Firebase:
    url: https://github.com/firebase/firebase-ios-sdk
    from: 11.0.0
  GoogleSignIn:
    url: https://github.com/google/GoogleSignIn-iOS
    from: 8.0.0
  GoogleMobileAds:
    url: https://github.com/googleads/swift-package-manager-google-mobile-ads
    from: 12.0.0
  GoogleUserMessagingPlatform:
    url: https://github.com/googleads/swift-package-manager-google-user-messaging-platform
    from: 3.0.0
targets:
  YukleDetayla:
    type: application
    platform: iOS
    scheme: {}
    sources:
      - path: Sources
      - path: Resources
      - path: public
        type: folder
        buildPhase: resources
    dependencies:
      - package: Firebase
        product: FirebaseAuth
      - package: GoogleSignIn
        product: GoogleSignIn
      - package: GoogleMobileAds
      - package: GoogleUserMessagingPlatform
    entitlements:
      path: Sources/YukleDetayla.entitlements
      properties:
        com.apple.developer.applesignin: [Default]
    info:
      path: Sources/Info.plist
      properties:
        CFBundleDisplayName: Yükle Detayla
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleDevelopmentRegion: tr
        LSRequiresIPhoneOS: true
        ITSAppUsesNonExemptEncryption: false
        UIRequiresFullScreen: true
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UILaunchScreen:
          UIColorName: LaunchBG
        CFBundleURLTypes:
          - CFBundleURLSchemes: [$(GOOGLE_REVERSED_CLIENT_ID)]
        NSCameraUsageDescription: Ders kitabı veya defter sayfalarının fotoğrafını çekip özet ve test hazırlamak için kullanılır.
        NSPhotoLibraryUsageDescription: Galerideki sayfa fotoğraflarını seçip özet ve test hazırlamak için kullanılır.
        NSPhotoLibraryAddUsageDescription: Paylaştığın soru görselini fotoğraflarına kaydedebilmen için kullanılır.
        GADApplicationIdentifier: $(YD_ADMOB_APP_ID)
        YDAdInterstitial: $(YD_AD_INTERSTITIAL)
        NSUserTrackingUsageDescription: Reklamları sana daha uygun hale getirmek için kullanılır. İzin vermesen de uygulamanın tamamını kullanabilirsin.
