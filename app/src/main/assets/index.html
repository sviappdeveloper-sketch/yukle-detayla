<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Yükle Detayla — Özet ve Testler</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<script src="config.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js"></script>
<style>
:root{
  --bg:#f4f1ea; --card:#fffdf8; --ink:#1f2430; --muted:#6b7080; --line:#e3ddd0;
  --pri:#2f5d50; --pri2:#3f7a69; --acc:#e0a33a; --ok:#2e8b57; --okbg:#e3f3ea; --bad:#c0392b; --badbg:#fbe7e4;
  --sat:env(safe-area-inset-top,0px); --sab:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root{--bg:#15181e;--card:#1e222b;--ink:#eceef2;--muted:#9aa0ad;--line:#2e3340;--pri:#5fb39b;--pri2:#76c7af;--okbg:#17352a;--badbg:#3a1d1a}
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:Nunito,system-ui,sans-serif;line-height:1.5}
.wrap{max-width:760px;margin:0 auto;padding:calc(10px + var(--sat)) 14px calc(70px + var(--sab))}
.hidden{display:none!important}
.muted{color:var(--muted)}
.small{font-size:.85rem}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.between{justify-content:space-between}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px;margin-bottom:12px}
.btn{appearance:none;border:0;border-radius:14px;padding:12px 16px;font:inherit;font-weight:800;cursor:pointer;background:var(--pri);color:#fff;display:inline-flex;align-items:center;justify-content:center;gap:8px}
.btn:active{transform:scale(.98)}
.btn.ghost{background:transparent;color:var(--pri);border:1.5px solid var(--pri)}
.btn.soft{background:color-mix(in srgb,var(--pri) 10%,transparent);color:var(--pri)}
.btn.block{width:100%}
.btn:disabled{opacity:.45}
.iconbtn{appearance:none;border:0;background:transparent;color:var(--ink);font:inherit;font-size:1.3rem;width:42px;height:42px;border-radius:12px;cursor:pointer;display:grid;place-items:center}
.iconbtn:active{background:color-mix(in srgb,var(--ink) 8%,transparent)}
.top{display:flex;align-items:center;gap:6px;margin-bottom:12px;min-height:44px}
.top h2{margin:0;font-size:1.2rem;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.err-box{background:var(--badbg);border:1px solid var(--bad);border-radius:12px;padding:12px;margin-top:10px}
.info-box{background:color-mix(in srgb,var(--acc) 12%,transparent);border:1px solid color-mix(in srgb,var(--acc) 50%,transparent);border-radius:12px;padding:10px 12px}

/* Giriş */
.login{min-height:calc(100vh - 40px);display:flex;flex-direction:column;justify-content:center;gap:14px;text-align:center}
.logo-big{width:92px;height:92px;border-radius:26px;background:var(--pri);display:grid;place-items:center;margin:0 auto;font-size:48px;box-shadow:0 10px 30px color-mix(in srgb,var(--pri) 35%,transparent)}
.login h1{margin:6px 0 0;font-size:2rem;font-weight:900}
.sso{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;padding:14px;border-radius:14px;font:inherit;font-weight:800;font-size:1.02rem;cursor:pointer;border:1.5px solid var(--line);background:var(--card);color:var(--ink)}
.sso.apple{background:#000;color:#fff;border-color:#000}
.sso svg{width:22px;height:22px}
.linkbtn{appearance:none;border:0;background:none;font:inherit;font-weight:700;color:var(--muted);text-decoration:underline;cursor:pointer;padding:6px}
.demo-form{display:flex;flex-direction:column;gap:10px}
.demo-form input{font:inherit;padding:13px 14px;border-radius:14px;border:1.5px solid var(--line);background:var(--card);color:var(--ink);width:100%;box-sizing:border-box}

/* Ana menü */
.hello{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.avatar{width:42px;height:42px;border-radius:50%;background:var(--pri);color:#fff;display:grid;place-items:center;font-weight:900;overflow:hidden;flex:none}
.avatar img{width:100%;height:100%;object-fit:cover}
.hello h1{margin:0;font-size:1.25rem}
.duo{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}
@media (max-width:520px){.duo{grid-template-columns:1fr}}
.feature{border-radius:18px;padding:14px;color:#fff;min-height:150px;display:flex;flex-direction:column;gap:8px;cursor:pointer;position:relative;overflow:hidden}
.feature.q{background:linear-gradient(135deg,#2f5d50,#3f7a69)}
.feature.k{background:linear-gradient(135deg,#b7791f,#e0a33a)}
.feature .lbl{font-weight:900;font-size:.82rem;letter-spacing:.06em;text-transform:uppercase;opacity:.9}
.feature .txt{font-weight:700;font-size:1rem;flex:1}
.feature .src{font-size:.78rem;opacity:.85}
.feature .deco{position:absolute;right:-10px;bottom:-14px;font-size:70px;opacity:.15}
.tiles{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.tile{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px 14px;cursor:pointer;display:flex;flex-direction:column;gap:6px;font:inherit;color:var(--ink);text-align:left}
.tile .ic{font-size:1.8rem}
.tile b{font-size:1.02rem}
.tile span{color:var(--muted);font-size:.82rem}
.tile.wide{grid-column:1/-1;flex-direction:row;align-items:center;gap:14px;background:var(--pri);color:#fff;border-color:var(--pri)}
.tile.wide span{color:#fff;opacity:.85}

/* Yükleme */
.drop{border:2px dashed var(--line);border-radius:16px;padding:26px 14px;text-align:center;cursor:pointer;position:relative;overflow:hidden}
.pgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
.pbtn{display:flex;align-items:center;gap:10px;border:1.5px solid var(--line);border-radius:12px;padding:12px;cursor:pointer;font:inherit;font-weight:700;background:var(--card);color:var(--ink);position:relative;overflow:hidden;text-align:left}
.pbtn span{font-size:1.3rem}
.overlay-input{position:absolute;inset:0;width:100%;height:100%;opacity:0;cursor:pointer;font-size:200px;z-index:2}
.thumbs{display:flex;gap:6px;overflow-x:auto;margin-top:8px}
.thumbs img{height:80px;border-radius:8px;border:1px solid var(--line)}
.chosen{display:flex;align-items:center;gap:10px;padding:12px;border-radius:12px;background:color-mix(in srgb,var(--pri) 8%,transparent)}
.opt-row{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px 0;border-bottom:1px solid var(--line)}
.opt-row:last-child{border-bottom:0}
.check{display:flex;align-items:center;gap:10px;cursor:pointer;font-weight:700}
.check input{width:22px;height:22px;accent-color:var(--pri)}
.count{display:flex;gap:6px}
.count button{width:40px;height:40px;border-radius:12px;border:1.5px solid var(--line);background:var(--card);color:var(--ink);font:inherit;font-weight:800;cursor:pointer}
.count button.on{background:var(--pri);color:#fff;border-color:var(--pri)}
.steps{list-style:none;padding:0;margin:10px 0 0}
.steps li{padding:8px 0;display:flex;gap:10px;align-items:center;border-bottom:1px solid var(--line)}
.steps li:last-child{border:0}
.dot{width:22px;height:22px;border-radius:50%;border:2px solid var(--line);flex:none;display:grid;place-items:center;font-size:12px}
.steps li.run .dot{border-color:var(--acc);border-top-color:transparent;animation:spin 1s linear infinite}
.steps li.done .dot{background:var(--ok);border-color:var(--ok);color:#fff}
.steps li.err .dot{background:var(--bad);border-color:var(--bad);color:#fff}
@keyframes spin{to{transform:rotate(360deg)}}
.bar{height:8px;background:var(--line);border-radius:6px;overflow:hidden;margin-top:12px}
.bar>i{display:block;height:100%;background:var(--pri);width:0;transition:width .4s}

/* Listeler */
.list .item{display:flex;align-items:center;gap:12px;padding:14px;border:1px solid var(--line);background:var(--card);border-radius:16px;margin-bottom:8px;cursor:pointer}
.item .ic{width:42px;height:42px;border-radius:12px;display:grid;place-items:center;background:color-mix(in srgb,var(--pri) 12%,transparent);font-size:1.3rem;flex:none}
.item .t{font-weight:800;line-height:1.25}
.item .s{color:var(--muted);font-size:.82rem}
.item .grow{flex:1;min-width:0}
.item .t,.item .s{overflow:hidden;text-overflow:ellipsis}
.empty{text-align:center;padding:40px 10px;color:var(--muted)}
.empty .big{font-size:46px}
.tabs{display:flex;gap:6px;margin-bottom:12px}
.tab{flex:1;border:1.5px solid var(--line);background:var(--card);color:var(--ink);border-radius:999px;padding:9px 10px;font:inherit;font-weight:800;cursor:pointer}
.tab.on{background:var(--pri);border-color:var(--pri);color:#fff}

/* Özet */
.summary h3{margin:18px 0 6px;font-size:1.05rem;color:var(--pri)}
.summary p{margin:0 0 10px}
.summary ul{margin:0 0 10px;padding-left:20px}
.term{border-left:3px solid var(--acc);padding:4px 10px;background:color-mix(in srgb,var(--acc) 8%,transparent);border-radius:0 8px 8px 0;margin-bottom:8px}
.pg{display:inline-block;font-size:.75rem;font-weight:800;color:var(--pri);background:color-mix(in srgb,var(--pri) 10%,transparent);border-radius:999px;padding:1px 8px;cursor:pointer;margin-left:4px;border:0;font-family:inherit}

/* Test */
.qnav{display:flex;gap:5px;overflow-x:auto;padding-bottom:6px;margin-bottom:10px}
.qnav button{flex:none;width:32px;height:32px;border-radius:9px;border:1.5px solid var(--line);background:var(--card);color:var(--ink);font:inherit;font-weight:800;font-size:.8rem;cursor:pointer}
.qnav button.cur{border-color:var(--pri);box-shadow:0 0 0 2px color-mix(in srgb,var(--pri) 35%,transparent)}
.qnav button.ok{background:var(--okbg);border-color:var(--ok)}
.qnav button.bad{background:var(--badbg);border-color:var(--bad)}
.qnav button.rev{background:color-mix(in srgb,var(--acc) 18%,transparent);border-color:var(--acc)}
.reveal{margin-top:10px;width:100%;background:transparent;border:1.5px dashed var(--acc);color:var(--ink);border-radius:12px;padding:10px;font:inherit;font-weight:800;cursor:pointer}
.qhead{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}
.qhead>div{display:flex}
.qtext{font-weight:800;font-size:1.08rem;margin:4px 0 12px}
.opts{display:grid;gap:8px}
.opt{text-align:left;border:1.5px solid var(--line);background:var(--card);color:var(--ink);border-radius:12px;padding:12px;font:inherit;cursor:pointer;display:flex;gap:10px}
.opt b{flex:none;width:22px}
.opt.ok{border-color:var(--ok);background:var(--okbg)}
.opt.bad{border-color:var(--bad);background:var(--badbg)}
.opt:disabled{cursor:default}
.hint{margin-top:12px;padding:12px;border-radius:12px;background:color-mix(in srgb,var(--muted) 10%,transparent);font-size:.94rem}
.hint .verdict{font-weight:900;margin-bottom:4px}
.hint .quote{margin-top:8px;padding:8px 10px;border-left:3px solid var(--acc);background:color-mix(in srgb,var(--acc) 8%,transparent);border-radius:0 8px 8px 0;font-style:italic}
.pagelink{margin-top:8px;display:inline-flex;align-items:center;gap:6px;font-weight:800;color:var(--pri);background:transparent;border:1.5px solid var(--pri);border-radius:10px;padding:7px 10px;font:inherit;cursor:pointer}
.qfoot{display:flex;gap:8px;margin-top:14px}
.qfoot .btn{flex:1}
.star.on{color:#e0a33a}
.score-big{font-size:2.2rem;font-weight:900}

/* PDF görüntüleyici */
.viewer canvas,.viewer img{width:100%;height:auto;border-radius:10px;border:1px solid var(--line);background:#fff;display:block}
.vquote{margin-bottom:10px}

/* Alt sayfa / modal */
.modal{position:fixed;inset:0;background:rgba(0,0,0,.5);display:flex;align-items:flex-end;justify-content:center;z-index:50;padding:10px}
.sheet{background:var(--card);border-radius:20px;padding:16px;width:100%;max-width:560px;max-height:90vh;overflow:auto;margin-bottom:var(--sab)}
.sheet img{width:100%;border-radius:12px;border:1px solid var(--line)}
.toast{position:fixed;left:50%;bottom:calc(20px + var(--sab));transform:translateX(-50%);background:#1f2430;color:#fff;padding:10px 16px;border-radius:12px;font-weight:700;z-index:60;max-width:90vw;text-align:center}
</style>
</head>
<body>
<div class="wrap" id="app"></div>
<div id="modalRoot"></div>

<script>
(function(){
'use strict';
const $ = (s, r=document) => r.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const LETTERS = ['A','B','C','D','E'];
const PER_TEST = 20, MAX_TESTS = 5, MAX_CHARS = 120000;
const APP_NAME = 'Yükle Detayla';
const LINKS = Object.assign({
  web: 'https://sviappdeveloper-sketch.github.io/yukle-detayla/',
  play: 'https://play.google.com/store/apps/details?id=com.mobihome.yukledetayla',
  appstore: '',
  privacy: 'https://sviappdeveloper-sketch.github.io/yukle-detayla/gizlilik.html',
  support: 'https://sviappdeveloper-sketch.github.io/yukle-detayla/destek.html'
}, (window.APP_CONFIG && window.APP_CONFIG.links) || {});
const TEST_FOCUS = [
  'temel kavramlar ve tanımlar (kolay)',
  'önemli bilgiler ve detaylar (kolay-orta)',
  'neden-sonuç ilişkileri ve süreçler (orta)',
  'karşılaştırma, yorumlama ve uygulama (orta-zor)',
  'genel tekrar, karma ve zorlayıcı (zor)'
];
const NATIVE = window.Android || null;

// ================= Depolama (IndexedDB) =================
const DB = (() => {
  let dbp = null;
  function open(){
    if(dbp) return dbp;
    dbp = new Promise((res, rej) => {
      let r;
      try{ r = indexedDB.open('yukle-detayla', 1); }catch(e){ rej(e); return; }
      r.onupgradeneeded = () => { const d = r.result; ['docs','files','meta'].forEach(n => { if(!d.objectStoreNames.contains(n)) d.createObjectStore(n); }); };
      r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error);
    });
    return dbp;
  }
  const mem = {docs:new Map(), files:new Map(), meta:new Map()};
  async function tx(store, mode, fn){
    try{
      const d = await open();
      return await new Promise((res, rej) => { const t = d.transaction(store, mode); const s = t.objectStore(store); const out = fn(s); t.oncomplete = () => res(out && out.result !== undefined ? out.result : undefined); t.onerror = () => rej(t.error); });
    }catch(e){
      // Bellekte yedek (önizleme ortamı)
      const m = mem[store];
      return fn({ get:k=>({result:m.get(k)}), put:(v,k)=>{m.set(k,v);return{}}, delete:k=>{m.delete(k);return{}}, getAll:()=>({result:[...m.values()]}) });
    }
  }
  return {
    get:(s,k)=>tx(s,'readonly',st=>st.get(k)),
    put:(s,k,v)=>tx(s,'readwrite',st=>st.put(v,k)),
    del:(s,k)=>tx(s,'readwrite',st=>st.delete(k)),
    all:(s)=>tx(s,'readonly',st=>st.getAll())
  };
})();

let DOCS = [];          // tüm belgeler (bellekte)
let META = { favQ:[], favS:[], user:null };
async function loadAll(){
  DOCS = (await DB.all('docs')) || [];
  DOCS.sort((a,b)=>b.created-a.created);
  META = Object.assign({ favQ:[], favS:[], user:null }, (await DB.get('meta','meta')) || {});
}
const saveMeta = () => DB.put('meta','meta',META);
const saveDoc = d => DB.put('docs', d.id, d);
const docById = id => DOCS.find(d => d.id===id);

// ================= Yapay zekâ =================
function blobToB64(b){ return new Promise((res,rej)=>{ const r=new FileReader(); r.onload=()=>res(String(r.result).split(',')[1]); r.onerror=rej; r.readAsDataURL(b); }); }
function makeRemoteSample(cfg){
  const f = async (prompt, opts={}) => {
    const images = [];
    for(const b of (opts.images||[])) images.push(await blobToB64(b));
    let r;
    try{
      r = await fetch(cfg.apiUrl, {method:'POST', headers:{'content-type':'application/json','x-app-key':cfg.appKey||''}, body: JSON.stringify({prompt, images}), signal: opts.signal});
    }catch(e){ if(opts.signal && opts.signal.aborted) throw e; throw new Error('İnternet bağlantısı yok gibi görünüyor.'); }
    if(r.status===429) throw {code:'rate_limited', message:'Kullanım sınırı'};
    let j = {}; try{ j = await r.json(); }catch(e){}
    if(!r.ok) throw new Error(j.error || ('Sunucu hatası '+r.status));
    return {text: j.text||'', truncated: !!j.truncated};
  };
  f.limits = async () => ({images:true});
  return f;
}
let sample = null;
const samplePromise = (async () => {
  const cfg = window.APP_CONFIG;
  if(cfg && cfg.apiUrl) return makeRemoteSample(cfg);
  for(let i=0;i<30 && !window.claude;i++) await new Promise(r=>setTimeout(r,100));
  try{ return window.claude ? await window.claude.use('sample') : null; }catch(e){ return null; }
})();
samplePromise.then(s => sample = s);
async function needAi(){ if(!sample) sample = await samplePromise; return !!sample; }

function parseJson(t){
  if(t && typeof t === 'object') return t;
  let s = String(t||'').trim().replace(/^```(?:json)?\s*/i,'').replace(/```\s*$/,'');
  try{ return JSON.parse(s); }catch(e){}
  const a=s.indexOf('{'), b=s.lastIndexOf('}');
  if(a>=0&&b>a){ try{ return JSON.parse(s.slice(a,b+1)); }catch(e){} }
  throw new Error('Yanıt okunamadı');
}
async function ask(prompt, images, signal, onWait){
  const opts = { signal, modelTier:'default' };
  if(images && images.length) opts.images = images;
  for(let attempt=0;;attempt++){
    try{ const r = await sample(prompt, opts); return parseJson(r.text); }
    catch(e){
      if(e && e.code==='rate_limited' && attempt<3 && !(signal&&signal.aborted)){
        for(let s=40;s>0;s--){ if(signal&&signal.aborted) throw e; onWait && onWait(s); await new Promise(r=>setTimeout(r,1000)); }
        onWait && onWait(0); continue;
      }
      throw e;
    }
  }
}

// ================= PDF okuma =================
function pdfLib(){
  const lib = window.pdfjsLib;
  if(!lib) throw new Error('PDF okuyucu yüklenemedi. İnternet bağlantını kontrol et.');
  try{ lib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js'; }catch(e){}
  return lib;
}
async function readPdf(blob, onProg){
  const pdf = await pdfLib().getDocument({data: await blob.arrayBuffer(), isEvalSupported:false}).promise;
  const pages = [];
  for(let p=1;p<=pdf.numPages;p++){
    const tc = await (await pdf.getPage(p)).getTextContent();
    let text='', line='', lastY=null;
    for(const it of tc.items){
      const y = it.transform ? it.transform[5] : null;
      if(lastY!==null && y!==null && Math.abs(y-lastY)>2){ text += line.trim()+'\n'; line=''; }
      line += it.str + (it.hasEOL?'\n':' '); lastY=y;
    }
    text += line.trim();
    pages.push(text.replace(/[ \t]+/g,' ').replace(/\n{3,}/g,'\n\n').trim());
    onProg && onProg(`${p}/${pdf.numPages} sayfa`);
  }
  const chars = pages.join('').replace(/\s/g,'').length;
  if(chars < 150){
    // Taranmış PDF: ilk 12 sayfayı görüntü olarak gönder
    const images=[]; const n=Math.min(pdf.numPages,12);
    for(let p=1;p<=n;p++){ images.push(await renderPage(pdf,p,1.6,'image/jpeg')); onProg && onProg(`görüntü ${p}/${n}`); }
    return {pages: pdf.numPages, text:'', images};
  }
  return {pages: pdf.numPages, pageTexts: pages, images:[]};
}
async function renderPage(pdf, p, scale, type){
  const page = await pdf.getPage(p); const vp = page.getViewport({scale});
  const c = document.createElement('canvas'); c.width=vp.width; c.height=vp.height;
  await page.render({canvasContext:c.getContext('2d'), viewport:vp}).promise;
  if(type) return await new Promise(r=>c.toBlob(r,type,0.8));
  return c;
}
async function shrink(file){
  const url = URL.createObjectURL(file);
  try{
    const im = await new Promise((res,rej)=>{ const i=new Image(); i.onload=()=>res(i); i.onerror=rej; i.src=url; });
    const max=1600, k=Math.min(1,max/Math.max(im.width,im.height));
    const c=document.createElement('canvas'); c.width=Math.round(im.width*k); c.height=Math.round(im.height*k);
    c.getContext('2d').drawImage(im,0,0,c.width,c.height);
    return await new Promise(r=>c.toBlob(r,'image/jpeg',0.82));
  } finally { URL.revokeObjectURL(url); }
}
function docBlock(src){
  if(src.images && src.images.length) return `BELGE: Ekteki ${src.images.length} sayfa görüntüsü. 1. görüntü = Sayfa 1, 2. görüntü = Sayfa 2, ... Görüntülerdeki yazıyı dikkatle oku.`;
  let out='', note='';
  for(let i=0;i<src.pageTexts.length;i++){
    const chunk = `\n[[SAYFA ${i+1}]]\n${src.pageTexts[i]}\n`;
    if(out.length + chunk.length > MAX_CHARS){ note=`\n(Not: belge uzun olduğu için ilk ${i} sayfa verildi.)`; break; }
    out += chunk;
  }
  return `BELGE METNİ (her sayfa [[SAYFA n]] işaretiyle başlar):\n<<<${out}>>>${note}`;
}

const SUMMARY_PROMPT = src => `Sen deneyimli bir Türk öğretmensin. Aşağıdaki belgeyi öğrencinin çalışması için TÜRKÇE özetle. Belge başka dilde olsa bile Türkçe yaz.
YALNIZCA şu biçimde geçerli JSON döndür:
{"baslik":"belgenin konusu (kısa)","genel":"2-4 cümlelik genel özet","bolumler":[{"baslik":"alt başlık","ozet":"3-6 cümle","maddeler":["önemli nokta"],"sayfa":3}],"anahtar_kavramlar":[{"kavram":"terim","tanim":"kısa tanım","sayfa":2}],"akilda_kal":[{"bilgi":"sınavda çıkabilecek önemli bilgi","sayfa":4}]}
"sayfa" bilginin geçtiği sayfa numarasıdır. Uydurma bilgi ekleme.

${docBlock(src)}`;
const TESTS_PROMPT = (src, idxs, avoid) => `Sen deneyimli bir Türk öğretmensin. Aşağıdaki belgeye dayanarak TÜRKÇE çoktan seçmeli testler hazırla.
${idxs.length} ayrı test yaz, her birinde TAM OLARAK ${PER_TEST} soru olsun:
${idxs.map(t=>`- Test ${t+1}: ${TEST_FOCUS[t]}`).join('\n')}
Kurallar:
- Her sorunun 4 şıkkı (A-D), yalnızca biri doğru. Gerçek sınavlardaki gibi doğru cevaplar A, B, C, D arasında dengeli dağılsın; aynı şık art arda gelmesin.
- Yanlış şıklar (çeldiriciler) mantıklı ve doğru cevapla benzer uzunlukta olsun.
- Sorular yalnızca belgedeki bilgilere dayansın; testler arasında aynı soruyu tekrar etme.
- "aciklama": doğru cevabın neden doğru olduğunu 1-2 cümleyle anlat.
- "sayfa": cevabın bulunduğu sayfa numarası.
- "alinti": o sayfadan cevabı gösteren kısa alıntı (en fazla 25 kelime, belgedeki ifadeyle).${avoid.length?`\nÖnceki testlerdeki şu sorulara BENZEMEYEN yeni sorular yaz:\n- ${avoid.slice(-60).join('\n- ')}`:''}
YALNIZCA şu biçimde geçerli JSON döndür:
{"testler":[{"sorular":[{"soru":"...","secenekler":["...","...","...","..."],"dogru":0,"aciklama":"...","sayfa":1,"alinti":"..."}]}]}
("testler" dizisinde ${idxs.length} eleman olsun. "dogru" 0'dan başlayan şık sırasıdır.)

${docBlock(src)}`;
// Gerçek sınavlardaki gibi: doğru cevaplar şıklara eşit dağılır, aynı şık art arda en fazla 2 kez gelir.
// "Hepsi / Hiçbiri" gibi sıraya bağlı şıkları olan sorulara dokunulmaz.
const FIXED_OPT = /(hepsi|hiçbiri|hicbiri|yukarıdakiler|hiçbir|her ikisi|i ve ii|ii ve iii|i, ii)/i;
function balanceAnswers(qs){
  const n = qs.length; if(!n) return qs;
  const k = Math.min(4, Math.max(2, Math.min(...qs.map(q=>q.secenekler.length))));
  for(let attempt=0; attempt<200; attempt++){
    const pos=[]; for(let i=0;i<n;i++) pos.push(i%k);
    for(let i=n-1;i>0;i--){ const r=Math.floor(Math.random()*(i+1)); [pos[i],pos[r]]=[pos[r],pos[i]]; }
    let ok=true; for(let i=2;i<n;i++) if(pos[i]===pos[i-1] && pos[i]===pos[i-2]){ ok=false; break; }
    if(!ok && attempt<199) continue;
    qs.forEach((q,i)=>{
      if(q.secenekler.some(o=>FIXED_OPT.test(o))) return;
      const target = Math.min(pos[i], q.secenekler.length-1);
      if(target===q.dogru) return;
      const s=q.secenekler.slice(); [s[target], s[q.dogru]] = [s[q.dogru], s[target]];
      q.secenekler = s; q.dogru = target;
    });
    return qs;
  }
  return qs;
}
function cleanQs(arr, maxPage){
  return (arr||[]).filter(q => q && q.soru && Array.isArray(q.secenekler) && q.secenekler.length>=2).slice(0,PER_TEST)
    .map(q => { const pg = parseInt(q.sayfa,10); return { soru:String(q.soru), secenekler:q.secenekler.slice(0,5).map(String), dogru: Math.max(0, Math.min(q.secenekler.length-1, parseInt(q.dogru,10)||0)), aciklama:String(q.aciklama||''), sayfa: (pg>=1 && pg<=maxPage) ? pg : null, alinti: String(q.alinti||'') }; });
}

// Arka planda çalışan üretim işi
const JOB = { active:null };
async function runJob(job){
  const {doc, src, wantSummary, testCount} = job;
  const signal = job.ctrl.signal;
  const wait = s => { job.waitMsg = s ? `Yoğunluk var, ${s} sn sonra tekrar denenecek…` : ''; renderJobIfVisible(); };
  const steps = job.steps;
  const setStep = (i, st, ex) => { steps[i].st = st; if(ex!==undefined) steps[i].ex = ex; renderJobIfVisible(); };
  try{
    if(wantSummary){
      const si = steps.findIndex(s=>s.key==='sum');
      setStep(si,'run');
      try{
        const r = await ask(SUMMARY_PROMPT(src), src.images, signal, wait);
        doc.summary = r; await saveDoc(doc); setStep(si,'done');
      }catch(e){ if(signal.aborted) return; setStep(si,'err'); throw e; }
    }
    const groups = []; for(let t=0;t<testCount;t+=3) groups.push([...Array(Math.min(3,testCount-t)).keys()].map(i=>t+i));
    const avoid = [];
    for(const g of groups){
      if(signal.aborted) return;
      const idx = g.map(t => steps.findIndex(s=>s.key==='t'+t));
      idx.forEach(i=>setStep(i,'run'));
      let got=null, tries=0, lastErr=null;
      while(!got && tries<2){
        tries++;
        try{
          const r = await ask(TESTS_PROMPT(src, g, avoid), src.images, signal, wait);
          const tests = r.testler || r.tests || (r.sorular?[r]:[]);
          const out = g.map((t,i)=>balanceAnswers(cleanQs(tests[i] && (tests[i].sorular||tests[i].questions||tests[i]), doc.pages)));
          if(out.some(a=>a.length<5)) throw new Error('Yeterli soru üretilemedi');
          got = out;
        }catch(e){ if(signal.aborted) return; lastErr=e; if(e && (e.code==='rate_limited'||e.code==='not_granted')) break; }
      }
      if(!got){ idx.forEach(i=>setStep(i,'err')); throw lastErr || new Error('Sorular hazırlanamadı'); }
      g.forEach((t,i)=>{ doc.tests[t]=got[i]; doc.answers[t]={}; doc.progress[t]=0; got[i].forEach(q=>avoid.push(q.soru.slice(0,90))); setStep(idx[i],'done',`${got[i].length} soru`); });
      await saveDoc(doc);
    }
    job.done = true;
  }catch(e){
    job.error = errText(e);
  }finally{
    if(!DOCS.includes(doc) && (doc.summary || doc.tests.some(Boolean))) DOCS.unshift(doc);
    renderJobIfVisible();
  }
}
function errText(e){
  if(e && e.code==='rate_limited') return 'Günlük ücretsiz kullanım sınırına ulaşıldı. Daha sonra tekrar dene.';
  if(e && e.code==='not_granted') return 'Yapay zekâ izni verilmedi.';
  return (e && e.message) ? 'Bir sorun oldu: '+e.message : 'Bir sorun oldu.';
}

// Demo hesabı doğrulaması (özel adres şemasında crypto.subtle bulunmadığı için küçük bir SHA-256)
const DEMO_HASH = '2e1d9bceafdeb597f08cec738cacfebb7fa604ac57d730a9c537303fe8c295de';
function sha256(str){
  const K=[],H=[]; let n=2,c=0; const fr=x=>((x-Math.floor(x))*4294967296)|0;
  while(c<64){ let pr=true; for(let i=2;i*i<=n;i++) if(n%i===0){ pr=false; break; } if(pr){ if(c<8) H[c]=fr(Math.pow(n,1/2)); K[c++]=fr(Math.pow(n,1/3)); } n++; }
  const b=Array.from(new TextEncoder().encode(str)), l=b.length*8; b.push(128); while(b.length%64!==56) b.push(0);
  for(let i=7;i>=0;i--) b.push(i>3?0:(l>>>(i*8))&255);
  const r=(x,k)=>(x>>>k)|(x<<(32-k)), w=new Array(64);
  for(let o=0;o<b.length;o+=64){
    for(let i=0;i<16;i++) w[i]=(b[o+i*4]<<24)|(b[o+i*4+1]<<16)|(b[o+i*4+2]<<8)|b[o+i*4+3];
    for(let i=16;i<64;i++){ const a=w[i-15],d=w[i-2]; w[i]=(w[i-16]+(r(a,7)^r(a,18)^(a>>>3))+w[i-7]+(r(d,17)^r(d,19)^(d>>>10)))|0; }
    let [a,bb,cc,d,e,f,g,h]=H;
    for(let i=0;i<64;i++){ const t1=(h+(r(e,6)^r(e,11)^r(e,25))+((e&f)^(~e&g))+K[i]+w[i])|0, t2=((r(a,2)^r(a,13)^r(a,22))+((a&bb)^(a&cc)^(bb&cc)))|0; h=g; g=f; f=e; e=(d+t1)|0; d=cc; cc=bb; bb=a; a=(t1+t2)|0; }
    H[0]=(H[0]+a)|0; H[1]=(H[1]+bb)|0; H[2]=(H[2]+cc)|0; H[3]=(H[3]+d)|0; H[4]=(H[4]+e)|0; H[5]=(H[5]+f)|0; H[6]=(H[6]+g)|0; H[7]=(H[7]+h)|0;
  }
  return H.map(x=>(x>>>0).toString(16).padStart(8,'0')).join('');
}

  const p = pending; const wantSummary = opts.summary; const testCount = opts.tests;
  const doc = { id: 'd'+Date.now().toString(36)+Math.random().toString(36).slice(2,6), name:p.name, kind:p.kind, created:Date.now(), pages:0, summary:null, tests:[], answers:{}, progress:{} };
  const steps = [{key:'read', name: p.kind==='pdf'?'PDF okunuyor':'Fotoğraflar hazırlanıyor'}];
  if(wantSummary) steps.push({key:'sum', name:'Özet'});
  for(let t=0;t<testCount;t++) steps.push({key:'t'+t, name:`Test ${t+1} (${PER_TEST} soru)`});
  const job = { doc, steps, ctrl:new AbortController(), closed:false };
  JOB.active = job; pending = null;
  render();
  // Reklam: üretim arka planda başlar
  try{ if(NATIVE && NATIVE.showInterstitial) NATIVE.showInterstitial(); }catch(e){}
  try{
    steps[0].st='run'; renderJobIfVisible();
    let src;
    if(p.kind==='pdf'){
      src = await readPdf(p.file, m=>{ steps[0].ex=m; renderJobIfVisible(); });
      await DB.put('files', doc.id, {kind:'pdf', blob:p.file});
    } else {
      const imgs=[]; for(let i=0;i<p.images.length;i++){ imgs.push(await shrink(p.images[i])); steps[0].ex=`${i+1}/${p.images.length}`; renderJobIfVisible(); }
      src = {pages: imgs.length, images: imgs};
      await DB.put('files', doc.id, {kind:'images', images:imgs});
    }
    doc.pages = src.pages;
    steps[0].st='done'; steps[0].ex=`${src.pages} sayfa`; renderJobIfVisible();
    job.src = src;
  }catch(e){ steps[0].st='err'; job.error = e.message || 'Dosya okunamadı.'; renderJobIfVisible(); return; }
  job.wantSummary = wantSummary; job.testCount = testCount;
  await runJob(job);
}

function questionCard(d, t, i, chosen, mode){

// ================= Paylaşım =================
function wrapLines(ctx, text, maxW){
  const words = String(text).split(/\s+/); const lines=[]; let line='';
  for(const w of words){ const t = line?line+' '+w:w; if(ctx.measureText(t).width>maxW && line){ lines.push(line); line=w; } else line=t; }
  if(line) lines.push(line); return lines;
}
function rr(ctx,x,y,w,h,r){ ctx.beginPath(); ctx.moveTo(x+r,y); ctx.arcTo(x+w,y,x+w,y+h,r); ctx.arcTo(x+w,y+h,x,y+h,r); ctx.arcTo(x,y+h,x,y,r); ctx.arcTo(x,y,x+w,y,r); ctx.closePath(); }
function drawStoreBadge(ctx, x, y, w, h, kind){
  ctx.fillStyle='#111'; rr(ctx,x,y,w,h,16); ctx.fill();
  ctx.fillStyle='#fff';
  // Basit simge
  const cx=x+44, cy=y+h/2;
  if(kind==='apple'){ ctx.beginPath(); ctx.arc(cx,cy+4,17,0,Math.PI*2); ctx.fill(); ctx.fillStyle='#111'; ctx.beginPath(); ctx.arc(cx+17,cy+2,8,0,Math.PI*2); ctx.fill(); ctx.fillStyle='#fff'; ctx.beginPath(); ctx.ellipse(cx+4,cy-20,5,9,0.6,0,Math.PI*2); ctx.fill(); }
  else { ctx.beginPath(); ctx.moveTo(cx-14,cy-20); ctx.lineTo(cx+20,cy); ctx.lineTo(cx-14,cy+20); ctx.closePath(); const g=ctx.createLinearGradient(cx-14,cy-20,cx+20,cy+20); g.addColorStop(0,'#34A853'); g.addColorStop(.5,'#FBBC05'); g.addColorStop(1,'#EA4335'); ctx.fillStyle=g; ctx.fill(); }
  ctx.fillStyle='#fff'; ctx.textBaseline='middle';
  ctx.font='600 20px Nunito, sans-serif'; ctx.fillText(kind==='apple'?'İndir':'İndir', x+82, y+h/2-15);
  ctx.font='900 30px Nunito, sans-serif'; ctx.fillText(kind==='apple'?'App Store':'Google Play', x+82, y+h/2+14);
  ctx.textBaseline='alphabetic';
}
async function questionImage(q, d){
  try{ await document.fonts.ready; }catch(e){}
  const W=1080, H=1350; const c=document.createElement('canvas'); c.width=W; c.height=H; const x=c.getContext('2d');
  const g=x.createLinearGradient(0,0,W,H); g.addColorStop(0,'#2f5d50'); g.addColorStop(1,'#1d3b33'); x.fillStyle=g; x.fillRect(0,0,W,H);
  x.fillStyle='rgba(255,255,255,.06)'; x.beginPath(); x.arc(W-60,120,220,0,Math.PI*2); x.fill(); x.beginPath(); x.arc(80,H-260,180,0,Math.PI*2); x.fill();
  // Üst başlık
  x.fillStyle='#e0a33a'; rr(x,70,70,84,84,22); x.fill();
  x.font='52px sans-serif'; x.textAlign='center'; x.textBaseline='middle'; x.fillText('📚',112,114); x.textAlign='left'; x.textBaseline='alphabetic';
  x.fillStyle='#fff'; x.font='900 54px Nunito, sans-serif'; x.fillText(APP_NAME,176,112);
  x.fillStyle='rgba(255,255,255,.75)'; x.font='700 28px Nunito, sans-serif'; x.fillText('Bu soruyu çözebilir misin? 🤔',178,150);
  // Soru kartı
  const cardX=60, cardY=210, cardW=W-120;
  x.font='800 42px Nunito, sans-serif'; const ql = wrapLines(x, q.soru, cardW-80).slice(0,7);
  x.font='700 34px Nunito, sans-serif';
  const ol = q.secenekler.map((o,j)=>wrapLines(x, `${LETTERS[j]})  ${o}`, cardW-120).slice(0,3));
  let h = 50 + ql.length*54 + 30 + ol.reduce((s,l)=>s+l.length*44+36,0) + 20;
  h = Math.min(h, 860);
  x.fillStyle='#fffdf8'; rr(x,cardX,cardY,cardW,h,36); x.fill();
  let y = cardY+80; x.fillStyle='#1f2430'; x.font='800 42px Nunito, sans-serif'; ql.forEach(l=>{ x.fillText(l,cardX+40,y); y+=54; });
  y += 14;
  x.font='700 34px Nunito, sans-serif';
  ol.forEach(lines=>{ const bh = lines.length*44+16; if(y+bh>cardY+h-10) return; x.fillStyle='#f1ede3'; rr(x,cardX+30,y-36,cardW-60,bh,18); x.fill(); x.fillStyle='#1f2430'; lines.forEach((l,k)=>x.fillText(l,cardX+52,y+k*44)); y+=bh+20; });
  // Alt şablon: uygulama adı + mağaza simgeleri
  const fy = H-220;
  x.fillStyle='#fff'; x.font='800 32px Nunito, sans-serif'; x.textAlign='center'; x.fillText('Cevabı ve açıklaması uygulamada 👇', W/2, fy); x.textAlign='left';
  drawStoreBadge(x, 120, fy+36, 400, 100, 'apple');
  drawStoreBadge(x, W-520, fy+36, 400, 100, 'play');
  x.fillStyle='rgba(255,255,255,.6)'; x.font='600 24px Nunito, sans-serif'; x.textAlign='center'; x.fillText(`${APP_NAME} · ${docTitle(d).slice(0,50)}`, W/2, H-32); x.textAlign='left';
  return c.toDataURL('image/png');
}
function shareText(extra){ return `${extra?extra+'\n\n':''}📚 ${APP_NAME} — PDF'ini yükle, özetini oku, testlerle çalış.\n📲 İndir: ${LINKS.web}`; }
async function doShare({text, image, title, file}){
  if(file){
    if(NATIVE && NATIVE.shareFile){ NATIVE.shareFile(await blobToB64(file.blob), file.mime, file.name, text||''); return; }
    try{
      const f = new File([file.blob], file.name, {type:file.mime});
      if(navigator.share && navigator.canShare && navigator.canShare({files:[f]})){ await navigator.share({files:[f], title:title||APP_NAME, text}); return; }
    }catch(e){ if(e && e.name==='AbortError') return; }
    const u = URL.createObjectURL(file.blob);
    openModal(`<b>${esc(file.name)}</b><p class="muted small">Bu görünümde doğrudan paylaşım yok. PDF'i aşağıdaki bağlantıdan açıp kaydedebilirsin.</p><a class="btn block" href="${u}" target="_blank" rel="noopener">📄 PDF'i aç</a>`);
    return;
  }
  if(NATIVE && NATIVE.shareImage && image){ NATIVE.shareImage(image.split(',')[1], text||''); return; }
  if(NATIVE && NATIVE.shareText){ NATIVE.shareText(text||''); return; }
  try{
    if(navigator.share){
      const data = {title:title||APP_NAME, text};
      if(image){ const blob = await (await fetch(image)).blob(); const file = new File([blob],'soru.png',{type:'image/png'}); if(navigator.canShare && navigator.canShare({files:[file]})) data.files=[file]; }
      await navigator.share(data); return;
    }
  }catch(e){ if(e && e.name==='AbortError') return; }
  openModal(`<b>Paylaş</b>${image?`<img src="${image}" style="margin:10px 0" alt="Paylaşım görseli"><div class="muted small">Görsele uzun basıp kaydedebilirsin.</div>`:''}<textarea style="width:100%;height:120px;margin-top:10px;border-radius:12px;border:1px solid var(--line);padding:10px;font:inherit;background:var(--bg);color:var(--ink)" readonly>${esc(text)}</textarea><button class="btn block" style="margin-top:8px" data-act="copyShare">Metni kopyala</button>`);
}
// ---- Testi PDF olarak hazırla (sayfalar tuvale çizilir, JPEG olarak PDF'e konur; Türkçe harfler sorunsuz) ----
function safeName(s){ return String(s).replace(/[^\p{L}\p{N}]+/gu,'-').replace(/^-|-$/g,'').slice(0,40) || 'Test'; }
async function testPdf(d,t){
  try{ await document.fonts.ready; }catch(e){}
  const qs = d.tests[t]; const W=1240, H=1754, M=100, CW=W-2*M;
  const pages=[]; let c,x,y,pageNo=0;
  const FONT='Nunito, Arial, sans-serif';
  function newPage(){
    c=document.createElement('canvas'); c.width=W; c.height=H; x=c.getContext('2d');
    x.fillStyle='#fff'; x.fillRect(0,0,W,H);
    pageNo++;
    // üst bilgi
    x.fillStyle='#2f5d50'; x.fillRect(0,0,W,120);
    x.fillStyle='#fff'; x.font=`900 40px ${FONT}`; x.fillText('📚 '+APP_NAME, M, 76);
    x.font=`700 26px ${FONT}`; x.textAlign='right'; x.fillText(`${docTitle(d).slice(0,40)} · Test ${t+1}`, W-M, 74); x.textAlign='left';
    // alt bilgi
    x.fillStyle='#6b7080'; x.font=`600 22px ${FONT}`; x.fillText(`${APP_NAME} ile hazırlandı · ${LINKS.web}`, M, H-50);
    x.textAlign='right'; x.fillText(String(pageNo), W-M, H-50); x.textAlign='left';
    y=190; pages.push(c);
  }
  function need(h){ if(y+h > H-110) newPage(); }
  newPage();
  x.fillStyle='#1f2430'; x.font=`900 46px ${FONT}`; x.fillText(`${docTitle(d)}`.slice(0,45), M, y); y+=50;
  x.fillStyle='#6b7080'; x.font=`600 26px ${FONT}`; x.fillText(`Test ${t+1} · ${qs.length} soru · ${TEST_FOCUS[t]||''}`, M, y); y+=30;
  x.fillText('Ad Soyad: ____________________________     Puan: ______', M, y+40); y+=100;
  qs.forEach((q,i)=>{
    x.font=`800 30px ${FONT}`; const ql = wrapLines(x, `${i+1}. ${q.soru}`, CW);
    x.font=`500 28px ${FONT}`; const ol = q.secenekler.map((o,j)=>wrapLines(x, `${LETTERS[j]}) ${o}`, CW-40));
    const h = ql.length*40 + ol.reduce((s,l)=>s+l.length*38,0) + 40;
    need(h);
    x.fillStyle='#1f2430'; x.font=`800 30px ${FONT}`; ql.forEach(l=>{ x.fillText(l, M, y); y+=40; });
    x.font=`500 28px ${FONT}`; ol.forEach(lines=>{ lines.forEach(l=>{ x.fillText(l, M+40, y); y+=38; }); });
    y+=30;
  });
  // cevap anahtarı
  newPage();
  x.fillStyle='#1f2430'; x.font=`900 42px ${FONT}`; x.fillText('Cevap Anahtarı', M, y); y+=60;
  x.font=`700 32px ${FONT}`;
  const cols=4, colW=CW/cols;
  qs.forEach((q,i)=>{ const col=i%cols, row=Math.floor(i/cols); x.fillText(`${i+1}. ${LETTERS[q.dogru]}`, M+col*colW, y+row*52); });
  y += Math.ceil(qs.length/cols)*52 + 30;
  x.font=`600 26px ${FONT}`; x.fillStyle='#6b7080';
  wrapLines(x, 'Açıklamalar ve cevapların geçtiği sayfalar Yükle Detayla uygulamasında.', CW).forEach(l=>{ x.fillText(l, M, y); y+=36; });
  // PDF dosyası
  const jpgs = [];
  for(const pg of pages){ const b = await new Promise(r=>pg.toBlob(r,'image/jpeg',0.85)); jpgs.push(new Uint8Array(await b.arrayBuffer())); }
  return makePdf(jpgs, W, H);
}
function makePdf(jpgs, iw, ih){
  const enc = new TextEncoder(); const parts=[]; const offs=[]; let len=0;
  const push = p => { const b = typeof p==='string' ? enc.encode(p) : p; parts.push(b); len+=b.length; };
  const PW=595.28, PH=841.89; const n=jpgs.length;
  // nesneler: 1 katalog, 2 sayfalar, her sayfa için: sayfa, içerik, görüntü
  const pageObj = k => 3+k*3, contObj = k => 4+k*3, imgObj = k => 5+k*3;
  push('%PDF-1.4\n%\xE2\xE3\xCF\xD3\n');
  const obj = (id, body) => { offs[id]=len; push(`${id} 0 obj\n`); body(); push('\nendobj\n'); };
  obj(1, ()=>push('<< /Type /Catalog /Pages 2 0 R >>'));
  obj(2, ()=>push(`<< /Type /Pages /Count ${n} /Kids [${jpgs.map((_,k)=>`${pageObj(k)} 0 R`).join(' ')}] >>`));
  jpgs.forEach((j,k)=>{
    obj(pageObj(k), ()=>push(`<< /Type /Page /Parent 2 0 R /MediaBox [0 0 ${PW} ${PH}] /Resources << /XObject << /Im0 ${imgObj(k)} 0 R >> >> /Contents ${contObj(k)} 0 R >>`));
    const cs = `q ${PW} 0 0 ${PH} 0 0 cm /Im0 Do Q`;
    obj(contObj(k), ()=>{ push(`<< /Length ${cs.length} >>\nstream\n`); push(cs); push('\nendstream'); });
    obj(imgObj(k), ()=>{ push(`<< /Type /XObject /Subtype /Image /Width ${iw} /Height ${ih} /ColorSpace /DeviceRGB /BitsPerComponent 8 /Filter /DCTDecode /Length ${j.length} >>\nstream\n`); push(j); push('\nendstream'); });
  });
  const total = 3 + n*3; const xref = len;
  let x = `xref\n0 ${total}\n0000000000 65535 f \n`;
  for(let i=1;i<total;i++) x += String(offs[i]).padStart(10,'0') + ' 00000 n \n';
  push(x); push(`trailer\n<< /Size ${total} /Root 1 0 R >>\nstartxref\n${xref}\n%%EOF\n`);
  return new Blob(parts, {type:'application/pdf'});
}
function testShareText(d,t){
  const qs = d.tests[t];
  const lines = qs.map((q,i)=>`${i+1}) ${q.soru}\n${q.secenekler.map((o,j)=>`   ${LETTERS[j]}) ${o}`).join('\n')}`).join('\n\n');
  return `📝 ${docTitle(d)} — Test ${+t+1} (${qs.length} soru)\n\n${lines}\n\n✅ Cevaplar ve açıklamalar uygulamada!`;
}

// Dosya seçme: düğmelerin üstüne görünmez gerçek dosya alanı
const PICK = {
  file: {accept:'application/pdf,.pdf', multiple:false},
  img: {accept:'image/*', multiple:true},
  cam: {accept:'image/*', multiple:false, capture:'environment'}
};
function attachPickers(){
  document.querySelectorAll('[data-pick]').forEach(b => {
    if(b.querySelector('.overlay-input')) return;
    const cfg = PICK[b.dataset.pick]; const inp=document.createElement('input');
    inp.type='file'; inp.className='overlay-input'; inp.accept=cfg.accept; inp.multiple=cfg.multiple; if(cfg.capture) inp.setAttribute('capture',cfg.capture);
    inp.addEventListener('click', e=>e.stopPropagation());
    inp.addEventListener('change', () => { const fs=[...inp.files]; inp.value=''; onPicked(b.dataset.pick, fs); });
    b.style.position = b.style.position || 'relative'; b.style.overflow='hidden'; b.appendChild(inp);
  });
}
function onPicked(kind, fs){
  if(!fs.length) return;
  if(kind==='file'){ const f=fs[0]; if(!/\.pdf$/i.test(f.name) && f.type!=='application/pdf'){ toast('Lütfen bir PDF seç'); return; } pending={name:f.name, kind:'pdf', file:f}; }
  else {
    const imgs = fs.filter(f=>f.type.startsWith('image/'));
    if(!imgs.length) return;
    if(pending && pending.kind==='images') pending.images.push(...imgs); else pending={name:'', kind:'images', images:imgs, thumbs:[]};
    pending.images = pending.images.slice(0,20);
    pending.thumbs = pending.images.map(f=>URL.createObjectURL(f));
    pending.name = `Fotoğraflar (${pending.images.length} sayfa)`;
  }
  render();
}

}
