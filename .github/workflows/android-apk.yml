name: Yükle Detayla APK
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: APK derle
        env:
          BUILD_NUMBER: ${{ github.run_number }}
        run: |
          chmod +x ./gradlew
          export BUILD_NUMBER=$((1000 + BUILD_NUMBER))
          ./gradlew assembleDebug
          mkdir -p out && cp app/build/outputs/apk/debug/*.apk out/YukleDetayla.apk
      - uses: actions/upload-artifact@v4
        with:
          name: YukleDetayla-apk
          path: out/YukleDetayla.apk
          retention-days: 1
      - name: APK'yı apk-build dalına koy (tek dosya, eskisinin üstüne)
        run: |
          cd out
          git init -q -b apk-build
          git config user.name "github-actions"; git config user.email "actions@github.com"
          git add YukleDetayla.apk && git commit -q -m "APK #${{ github.run_number }}"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}" apk-build
